<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Formatted Sample</title>
    <style>
      body {
        background: #111;
        color: #fff;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 10px;
      }
      p {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Messy HTML for Prettier Tour</h1>
      <p>
        This file has deliberately inconsistent indentation and minified tags to
        demonstrate Prettier's AST-based code formatting.
      </p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </div>
  </body>
</html>
